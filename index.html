<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRCH PSP</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand">DRCH PSP<span>+</span></div>
<input id="search" type="search" placeholder="Search games..." autocomplete="off">
<div class="views"><button id="vGrid" class="vbtn active" title="Grid">&#9638;</button><button id="vList" class="vbtn" title="List">&#9776;</button></div></header>
<nav id="cats"></nav>
<main><div id="games" class="grid"></div><p id="empty" hidden>No games found.</p></main>
<footer>D-Pad / Stick: move &nbsp; X: select / download &nbsp; O: back to categories</footer>
<script src="app.js"></script></body></html>
